name: Verify PilotVerdict release
on:
  push:
    branches: ['release/pilotverdict-simple-2026-11-20', 'main']
    paths: ['pilotverdict/**', '.release-pilotverdict/**', 'scripts/*pilotverdict*', '.github/workflows/pilotverdict-check.yml', 'index.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pilotverdict-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import exact reviewed release and preserve portfolio
        run: |
          python scripts/unpack_pilotverdict.py
          python scripts/add_pilotverdict_to_portfolio.py
      - name: Unit tests and reproducible build
        working-directory: pilotverdict
        run: |
          npm test
          npm run check
          npm run build
      - name: Install browser-only QA dependencies
        working-directory: pilotverdict
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts --package-lock=false axe-core@4.10.3
      - name: Native HTTP user journeys, privacy and accessibility
        working-directory: pilotverdict
        run: python scripts/release_browser_test.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilotverdict-native-qa
          path: pilotverdict/qa/
          if-no-files-found: ignore
      - name: Commit verified release on the isolated release branch
        if: success() && github.ref_name == 'release/pilotverdict-simple-2026-11-20'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pilotverdict/
          git rm -r --ignore-unmatch .release-pilotverdict/
          if ! git diff --cached --quiet; then
            git commit -m 'release: verified PilotVerdict 0.5.1 with original design and shared workflow (AI-assisted)'
            git push origin HEAD:${{ github.ref_name }}
          fi
